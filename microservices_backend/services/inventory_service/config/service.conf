# Inventory Service Configuration

# Server Settings
SERVER_PORT=8080
SERVER_HOST=0.0.0.0
MAX_THREADS=10
BACKLOG=10

# Service Discovery Settings
SERVICE_DISCOVERY_ENABLED=true
SERVICE_DISCOVERY_HOST=localhost
SERVICE_DISCOVERY_PORT=8000
CONFIG_FILE=../../config/platform_config.json

# Database Settings
DATABASE_HOST=localhost
DATABASE_PORT=5432
DATABASE_NAME=infrastructure_platform
DATABASE_USER=infrastructure_user
DATABASE_PASSWORD=change_me

# Logging Settings
LOG_LEVEL=INFO
LOG_FILE=/var/log/inventory_service.log

# Service Settings
SERVICE_NAME=inventory-microservice
SERVICE_VERSION=1.0.0
MAX_ASSETS=1000

# API Settings
API_TIMEOUT=30
MAX_REQUEST_SIZE=10485760

# CORS Settings
CORS_ENABLED=true
CORS_ORIGIN=*
CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS
CORS_HEADERS=Content-Type,Authorization

# Environment Override Settings
# These can be overridden by environment variables
# INVENTORY_SERVICE_HOST - Override service host for registration
# INVENTORY_SERVICE_PORT - Override service port for registration
# DATABASE_HOST - Override database host
# DATABASE_PORT - Override database port